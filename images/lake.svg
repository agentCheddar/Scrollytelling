<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A still lake at dusk with the moon reflected in rippling water">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c7d2"/>
      <stop offset="1" stop-color="#e7ecef"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d97a9"/>
      <stop offset="1" stop-color="#2d475a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbf8ee" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fbf8ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="250" fill="url(#sky)"/>
  <rect y="250" width="800" height="310" fill="url(#water)"/>

  <circle cx="560" cy="122" r="70" fill="url(#glow)"/>
  <circle cx="560" cy="122" r="30" fill="#f8f5ea"/>

  <g fill="#f8f5ea">
    <rect x="530" y="266" width="60" height="3" rx="1.5" opacity=".7"/>
    <rect x="538" y="282" width="44" height="3" rx="1.5" opacity=".55"/>
    <rect x="526" y="298" width="68" height="2.5" rx="1.25" opacity=".45"/>
    <rect x="544" y="314" width="32" height="2.5" rx="1.25" opacity=".38"/>
    <rect x="532" y="332" width="56" height="2" rx="1" opacity=".28"/>
    <rect x="548" y="352" width="24" height="2" rx="1" opacity=".2"/>
  </g>

  <g fill="none" stroke="#e9f0f4">
    <ellipse cx="300" cy="420" rx="40" ry="9" stroke-opacity=".55" stroke-width="2"/>
    <ellipse cx="300" cy="420" rx="92" ry="21" stroke-opacity=".38" stroke-width="1.6"/>
    <ellipse cx="300" cy="420" rx="156" ry="36" stroke-opacity=".24" stroke-width="1.3"/>
    <ellipse cx="300" cy="420" rx="232" ry="54" stroke-opacity=".13" stroke-width="1"/>
  </g>
</svg>
